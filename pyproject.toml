[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-dealer"
version = "0.2.0"
description = "Vendor-neutral cross-model agent collaboration runtime over a shared directory (MMAC protocol)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "agent_dealer contributors"}]
keywords = ["multi-agent", "collaboration", "llm", "protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# 运行时零第三方依赖（坚持标准库）；开发依赖单独声明
[project.optional-dependencies]
dev = ["coverage>=7", "build>=1", "twine>=5"]

[project.scripts]
agent-dealer = "agent_dealer.cli:main"
agent_dealer = "agent_dealer.cli:main"
collab = "agent_dealer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
