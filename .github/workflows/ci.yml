name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile check
        run: python -m compileall src tests
      - name: Unit tests
        run: python -m unittest discover -s tests/unit
      - name: Integration tests
        run: python -m unittest discover -s tests/integration
      - name: Golden example doctor
        run: agent-dealer doctor examples/quickstart
      - name: Portable legacy task doctor (grandfathered)
        # task-002 是本机自举审计日志，历史事件含创建机器的绝对路径；
        # 它由兼容测试覆盖，但不作为跨机器发布门禁。
        run: agent-dealer doctor tasks/task-20260810-001
      - name: Legacy expected-failure samples still fail
        run: |
          set -e
          if agent-dealer validate examples/legacy-expected-failure/task-bad-hash >/dev/null 2>&1; then
            echo "task-bad-hash should fail but passed"; exit 1
          fi
          if agent-dealer validate examples/legacy-expected-failure/task-placeholder-model >/dev/null 2>&1; then
            echo "task-placeholder-model should fail but passed"; exit 1
          fi
      - name: Secret scan (src only)
        # 仅扫描运行时代码；tests/ 与 fixtures/ 含故意写入的示例密钥用于回归校验。
        run: |
          python -c "from agent_collaboration.security import scan_tree_secrets; import sys; f=scan_tree_secrets('src'); print(f); sys.exit(1 if f else 0)"
      - name: Coverage
        run: |
          coverage run -m unittest discover -s tests
          coverage report --fail-under=90
